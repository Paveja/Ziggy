revolte:
  version: "1"
  project: Ziggy
  appName: Ziggy app
  env:
    preview:
      services:
        rid_1:
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
            variables:
              NODE_ENV: production
              PORT: "8080"
    qa:
      branch: qa
      services:
        rid_1:
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
    staging:
      branch: staging
      services:
        rid_1:
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
    production:
      branch: main
      services:
        rid_1:
          type: WEB_SERVICE
          entryPoint: src/app/page.tsx
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
          properties:
            health: /api/health
            port: 8080
            loadBalancerMode: shared
